name: Qivvera cumulative functional and browser checks
on:
  push:
    branches: [main, increments, increment3, increment4, increment5, increment6, increment7, increment8, increment9, increment10]
  pull_request:
permissions:
  contents: read
concurrency:
  group: qivvera-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: qivvera_test
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: qivvera_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qivvera_test -d qivvera_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://qivvera_test:disposable-ci-only@127.0.0.1:5432/qivvera_test_ci
      REQUIRE_POSTGRES: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install matching PostgreSQL recovery tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          test "$(gpg --show-keys --with-colons /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc | awk -F: '/^fpr:/{print $10; exit}')" = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
          . /etc/os-release
          sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null <<EOF
          Types: deb
          URIs: https://apt.postgresql.org/pub/repos/apt
          Suites: ${VERSION_CODENAME}-pgdg
          Components: main
          Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          EOF
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/pg_restore --version
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - name: Set up Python for browser checks
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install browser runtime
        run: |
          python3 -m venv .venv-browser
          .venv-browser/bin/python3 -m pip install -r test/requirements-browser.txt
          .venv-browser/bin/python3 -m playwright install --with-deps chromium
      - name: Cumulative automated, recovery, reference and native browser verification
        run: npm run check:engineering
      - name: Retain synthetic verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qivvera-verification-${{ github.sha }}
          path: review-test-results/
          if-no-files-found: ignore
          retention-days: 14
# No deploy, secret provisioning, production database access or paid resource creation.
# Native local HTTP browser checks do not replace hosted HTTPS, recovery or independent QE.
