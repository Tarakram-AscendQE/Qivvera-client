name: Qivvera foundation checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, resolved 2026-10-31
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7, resolved 2026-10-31
        with:
          node-version: '22'
          cache: npm
      - run: node --version && npm --version
      - run: npm ci --ignore-scripts
      - run: node scripts/selfcheck.mjs
      - run: npm run check
